apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 2.4.2
    helm:
      values: |
        serviceAccount:
          create: true
          name: pushgateway
        
        service:
          type: ClusterIP
          port: 9091
          targetPort: 9091
        
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 200m
        
        serviceMonitor:
          enabled: true
          namespace: monitoring
          additionalLabels:
            release: prometheus
        
        persistentVolume:
          enabled: false
        
        extraArgs:
          - --web.enable-admin-api
          - --web.enable-lifecycle
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
